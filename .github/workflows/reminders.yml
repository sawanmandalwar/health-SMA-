name: Reminder sweep

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set; skipping sweep."
            exit 0
          fi

          status=$(curl -s -o /tmp/reminder-response.json -w "%{http_code}" \
            --max-time 90 \
            "https://health-sma.vercel.app/api/cron/reminders?secret=${CRON_SECRET}")

          cat /tmp/reminder-response.json || true
          echo
          echo "HTTP ${status}"

          test "$status" = "200"
